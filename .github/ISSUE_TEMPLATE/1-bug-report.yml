name: 🐛 Bug report
description: Create a report to help us improve
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue.

        Please fill in as much of the following form as you're able.

  - type: input
    attributes:
      label: Version
      description: |
        Enter the version of CodeFactory Studio you are using.
        Please verify that you are reproducing the issue in a [currently-supported version](https://github.com/fynnhaupt/codefactory-studio/blob/main/SECURITY.md#supported-version) of CodeFactory Studio.
      placeholder: "e.g. 1.0.0-rc.1"
    validations:
      required: true

  - type: textarea
    attributes:
      label: What steps will reproduce the bug?
      description: >
        Enter details about your bug, preferably add a step-by-step reproduction guide.
    validations:
      required: true

  - type: textarea
    attributes:
      label: How often does it reproduce? Is there a required condition?
    validations:
      required: true

  - type: textarea
    attributes:
      label: What is the expected behavior? Why is that the expected behavior?
    validations:
      required: true

  - type: textarea
    attributes:
      label: What do you see instead?
      description: If possible please provide logs and screenshots.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional information
      description: Tell us anything else you think we should know.
