name: Deploy

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  name: codefactory-studio
  registry: ghcr.io

jobs:
  changesets-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: vscode
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    permissions:
      contents: write
      packages: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm prisma migrate deploy
      - run: |
          cat << EOF > "$HOME/.npmrc"
            //npm.pkg.github.com/:_authToken=$NPM_TOKEN
          EOF
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm publish-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    outputs:
      packages: ${{ steps.changesets.outputs.published-packages }}

  evaluate-packages:
    if: needs.changesets-deploy.outputs.packages != '[]'
    runs-on: ubuntu-latest
    needs: changesets-deploy

    steps:
      - id: app-version
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            const name = '${{ env.name }}';
            const packages = ${{ needs.changesets-deploy.outputs.packages }};
            const pkg = packages.find(pkg => pkg.name.includes(name));
            return pkg?.version ?? '';

    outputs:
      version: ${{ steps.app-version.outputs.result }}

  docker-deploy:
    if: needs.evaluate-packages.outputs.version != ''
    runs-on: ubuntu-latest
    needs: evaluate-packages

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.registry }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}},value=${{ needs.evaluate-packages.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.evaluate-packages.outputs.version }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: actions/attest@v4
        with:
          subject-name: ${{ env.registry }}/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
